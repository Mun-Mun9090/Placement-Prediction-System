{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Placement Prediction</h2>
    <p>Enter the student details below to predict their placement chances using the best performing machine learning model.</p>
    
    <form class="prediction-form" action="/predict" method="POST">
        <!-- Placeholder for prediction form fields -->
        <div class="form-group">
            <label for="cgpa">CGPA:</label>
            <input type="number" step="0.01" id="cgpa" name="cgpa" placeholder="Enter CGPA" required>
        </div>
        <div class="form-group">
            <label for="iq">IQ:</label>
            <input type="number" id="iq" name="iq" placeholder="Enter IQ score" required>
        </div>
        <button type="submit" class="btn-predict">Predict Placement</button>
    </form>
</div>
{% endblock %}
